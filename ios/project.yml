# ==============================================================================
# XcodeGen Project Spec
# ==============================================================================
# Генерация Xcode проекта:
#   brew install xcodegen
#   cd ios && xcodegen generate
# ==============================================================================

name: Swinter

options:
  bundleIdPrefix: com.swinter
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""  # <-- Вставь свой Team ID или оставь пустым для free signing
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

# ==============================================================================
# Schemes
# ==============================================================================

schemes:
  Swinter:
    build:
      targets:
        Swinter: all
        SwinterTunnel: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

# ==============================================================================
# Targets
# ==============================================================================

targets:

  # --- Основное приложение ---
  Swinter:
    type: application
    platform: iOS
    sources:
      - path: VKTurnVPN/App
        type: group
      - path: VKTurnVPN/Shared
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swinter.vpn
        PRODUCT_NAME: Swinter
        INFOPLIST_FILE: VKTurnVPN/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: VKTurnVPN/App/VKTurnVPN.entitlements
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        HEADER_SEARCH_PATHS:
          - "$(BUILT_PRODUCTS_DIR)/WebRTC.framework/Headers"
          - "$(BUILT_PRODUCTS_DIR)/WebRTC.framework/Headers/sdk/objc/base"
    dependencies:
      - target: SwinterTunnel
      - framework: ../golib/Swinterlib.xcframework
        embed: true

  # --- Network Extension (VPN туннель) ---
  SwinterTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: VKTurnVPN/Tunnel
        type: group
      - path: VKTurnVPN/Shared
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swinter.vpn.tunnel
        PRODUCT_NAME: SwinterTunnel
        INFOPLIST_FILE: VKTurnVPN/Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: VKTurnVPN/Tunnel/Tunnel.entitlements
        HEADER_SEARCH_PATHS:
          - "$(BUILT_PRODUCTS_DIR)/WebRTC.framework/Headers"
          - "$(BUILT_PRODUCTS_DIR)/WebRTC.framework/Headers/sdk/objc/base"
    dependencies:
      - framework: ../golib/Swinterlib.xcframework
        embed: false
